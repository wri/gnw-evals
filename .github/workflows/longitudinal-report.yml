name: Longitudinal Report

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to pull artifacts from"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      n_runs:
        description: "Number of recent eval-csv artifacts to include"
        required: false
        default: "5"
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "latest"

      - name: Download eval-csv artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix="eval-csv-${{ inputs.target_env }}-"
          repo="${{ github.repository }}"
          n_runs="${{ inputs.n_runs }}"

          gh api "repos/$repo/actions/artifacts?per_page=100" \
            --jq "[.artifacts[]
                | select(.name | startswith(\"$prefix\"))
              ] | sort_by(.created_at) | reverse | .[:$n_runs][] | [(.id | tostring), .name] | join(\"\t\")" \
            > /tmp/artifacts.txt

          echo "Artifacts to download:"
          cat /tmp/artifacts.txt

          while IFS=$'\t' read -r artifact_id artifact_name; do
            [ -z "$artifact_id" ] && continue
            echo "Downloading: $artifact_name (id: $artifact_id)"
            mkdir -p "outputs/$artifact_name"
            gh api "repos/$repo/actions/artifacts/$artifact_id/zip" > /tmp/artifact.zip
            unzip -j -o /tmp/artifact.zip -d "outputs/$artifact_name/"
            rm /tmp/artifact.zip
          done < /tmp/artifacts.txt

      - name: Install notebook dependencies
        run: |
          uv pip install --system \
            "marimo" \
            "altair==6.1.0" \
            "great-tables==0.21.0" \
            "numpy==2.4.4" \
            "pandas==3.0.3" \
            "pyarrow==24.0.0"

      - name: Build site directory
        run: |
          mkdir -p site/data

          # Copy each eval-csv-* folder into site/data/
          for folder in outputs/eval-csv-*/; do
            folder_name=$(basename "$folder")
            mkdir -p "site/data/$folder_name"
            cp "$folder"*_summary.csv "site/data/$folder_name/" 2>/dev/null || true
            cp "$folder"*_detailed.csv "site/data/$folder_name/" 2>/dev/null || true
          done

          # Generate manifest.json listing all available runs
          python3 - <<'EOF'
          import json, os, glob

          entries = []
          data_dir = "site/data"
          for folder in sorted(os.listdir(data_dir)):
            folder_path = os.path.join(data_dir, folder)
            if not (os.path.isdir(folder_path) and folder.startswith("eval-csv-")):
              continue
            summaries = sorted(glob.glob(f"{folder_path}/*_summary.csv"))
            detaileds = sorted(glob.glob(f"{folder_path}/*_detailed.csv"))
            if not summaries:
              continue
            entries.append({
              "folder": folder,
              "summary": os.path.basename(summaries[0]),
              "detailed": os.path.basename(detaileds[0]) if detaileds else None,
            })

          with open("site/manifest.json", "w") as f:
            json.dump(entries, f, indent=2)

          print(f"Manifest: {len(entries)} runs")
          for e in entries:
            print(f"  {e['folder']}: {e['summary']}")
          EOF

      - name: Export longitudinal report as WASM HTML
        run: |
          marimo export html-wasm notebooks/longitudinal_analysis.py \
            --no-include-code \
            -o site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
